apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcart-auth
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: auth
        image: fastcart-auth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /auth/health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /auth/health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20

        env:
        - name: DB_USER
          value: "fastcart_admin"
        - name: DB_HOST
          value: "fastcart-db-service"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: POSTGRES_PASSWORD
        - name: AUTH_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/fastcart_auth"
        - name: ALGORITHM
          value: "HS256"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: JWT_SECRET_KEY