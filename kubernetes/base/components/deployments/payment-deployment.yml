apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcart-payment
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: payment
        image: fastcart-payment:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8005
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /payments/health
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /payments/health
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 20
          
        env:
        - name: DB_USER
          value: "fastcart_admin"
        - name: DB_HOST
          value: "fastcart-db-service"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: POSTGRES_PASSWORD 
        - name: PAYMENT_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/fastcart_payment"
          
        - name: RABBIT_USER
          value: "admin"
        - name: RABBIT_HOST
          value: "fastcart-rabbitmq-service"
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: "amqp://$(RABBIT_USER):$(RABBIT_PASSWORD)@$(RABBIT_HOST):5672/"
          
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: STRIPE_WEBHOOK_SECRET