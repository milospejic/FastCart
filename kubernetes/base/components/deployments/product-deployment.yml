apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcart-product
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: product
        image: fastcart-product:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /products/health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /products/health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: DB_USER
          value: "fastcart_admin"
        - name: DB_HOST
          value: "fastcart-db-service"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: POSTGRES_PASSWORD 
        - name: product_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/fastcart_product"
        - name: RABBIT_USER
          value: "admin"
        - name: RABBIT_HOST
          value: "fastcart-rabbitmq-service"
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: "amqp://$(RABBIT_USER):$(RABBIT_PASSWORD)@$(RABBIT_HOST):5672/"          
        - name: ALGORITHM
          value: "HS256"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fastcart-secrets
              key: JWT_SECRET_KEY